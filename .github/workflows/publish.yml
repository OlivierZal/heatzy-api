# Calls the family's reusable publish (pack, attest, publish to GitHub
# Packages): the caller keeps the `release` trigger and grants exactly
# what the called job declares; the `npm` environment travels with it.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@f14c906e6db9327fb6a865911c994b645f15fd08 # v8.5.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
