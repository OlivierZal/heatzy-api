# Calls the family's reusable docs (typedoc build, GitHub Pages deploy):
# the caller keeps the `release` trigger and grants exactly what the
# called jobs declare; the `github-pages` environment travels with them.
# `dry-run` builds and packs the site without deploying it — the one
# rehearsal a release-only path can get: dispatch it by hand and watch
# the build half succeed before a release reaches the deploy half.
jobs:
  docs:
    permissions:
      contents: read
      id-token: write
      packages: read
      pages: write
    uses: OlivierZal/configs/.github/workflows/reusable-docs.yml@291dd9e28a6da8fe861d1ef9b4c21a5d4e813c3d # v7.1.0
    with:
      dry-run: ${{ inputs.dry-run || false }}
name: Generate & deploy docs
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        default: false
        description: Build the site without deploying it.
        type: boolean
permissions: {}
